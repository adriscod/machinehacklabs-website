# Machine Hack Labs — local rough-quote tunables (MHL-CF-001 / RFQ v2)
# Edit this file to calibrate the shop. No secrets belong here.
# All linear units are inches. Volumes are cubic inches. Money is USD.
#
# Catalog $/in³ and MRR_eff are TODO_REPLACE placeholders — not market rates.
# Andrew replaces the numbers below, then:
#   python mhl-quote/scripts/export_site_config.py
# Rush / emergency multipliers are starting points, not policy.

meta:
  estimator_version: 2
  costs_and_mrr: TODO_REPLACE
  note: >
    Every cost_usd_per_in3 and mrr_eff_in3_per_hr in this file is a
    placeholder (cost_placeholder / mrr_placeholder: TODO_REPLACE).
    Do not treat them as final shop or market rates. Replace them from
    invoices and finished-job chip time, then re-export site JSON.

shop:
  rate_usd_per_hr: 75          # labor only; materials are pass-through
  setup_hours: 1.0             # base_setup_hours; scaled by setups × rush_setup_mult
  min_charge_usd: 75
  band_low: 0.85               # quote_low = raw * band_low
  band_high: 1.25              # quote_high = raw * band_high

machine:
  name: Tormach 1500MX
  axes: 3
  # Published travels. Usable = envelope − fixture_margin.
  envelope_in:
    x: 19.7
    y: 13.8
    z: 14.0
  fixture_margin_in:
    x: 0.5
    y: 0.5
    z: 0.5

# due_date vs turnaround: if calendar lead is tighter than the selected
# tier, the estimator auto-bumps the tier and sets shop_review_required.
# Business days are Mon–Fri only; holidays are not excluded (TODO Andrew).
# Rush / emergency mults are STARTING POINTS — tune here, not in code.
turnaround:
  standard:
    labor_mult: 1.0
    setup_mult: 1.0
    min_business_days: 10      # TODO Andrew — starting lead
  rush:
    labor_mult: 1.5            # TODO Andrew — starting point
    setup_mult: 1.25           # TODO Andrew — starting point
    min_business_days: 4       # TODO Andrew — starting lead
  emergency:
    labor_mult: 2.0            # TODO Andrew — starting point
    setup_mult: 1.5            # TODO Andrew — starting point
    min_business_days: 1       # TODO Andrew — starting lead

# complexity_mult = min(feature_risk.mult_cap, tolerance_mult + n_risks × mult_each)
# cut_hours = (removal_vol / MRR_eff) × qty × complexity_mult
tolerance:
  standard: 1.0
  tight: 1.25
  precision: 1.5
  precision_requires_shop_review: true

feature_risks:
  keys:
    - deep_pockets
    - thin_walls
    - fine_engraving
    - many_holes
  mult_each: 0.15              # +~0.15 each checked risk
  mult_cap: 1.75               # combined complexity_mult cap

