<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Machine Hack Labs — Request a Quote{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="wrap header-inner">
            <a class="brand" href="{{ url_for('index') }}">
                <span class="brand-mark">MHL</span>
                <span class="brand-text">Machine Hack Labs</span>
            </a>
            <nav class="nav">
                <a href="{{ url_for('index') }}">Request a Quote</a>
                <a href="{{ url_for('list_requests') }}">Queue</a>
            </nav>
        </div>
    </header>

    <main class="wrap">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <p>Local rough-quote intake · machining-only 3-axis (Tormach 1500MX) · not a formal quote.</p>
        </div>
    </footer>
</body>
</html>
